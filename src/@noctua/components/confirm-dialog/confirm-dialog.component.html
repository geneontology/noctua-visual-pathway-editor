<div class="dialog-content-wrapper noc-dialog flex flex-col justify-start items-stretch">
  <div class="m-0 noc-dialog-header flex flex-row justify-start items-center">
    <span class="noc-dialog-header-title">
    {{title}}</span>
    <span class="grow"></span>
    <button mat-stroked-button (click)="cancel()" class="noc-rounded-button noc-sm" aria-label="Close dialog">
      <fa-icon [icon]="['fas', 'times']"></fa-icon> Close
    </button>
  </div>
  <div mat-dialog-content class="noc-dialog-body">
    {{message}}
  </div>
  @if (!readonlyDialog) {
    <div mat-dialog-actions class="m-0 p-16 noc-dialog-footer flex flex-row justify-between items-center">
      <span class="grow"></span>
      <button (click)='cancel()' type="button" mat-raised-button color="{{highlightCancel ? 'primary': ''}}" class="mr-8">
      {{cancelLabel}}</button>
      <button (click)="confirm()" type="button" mat-raised-button color="{{highlightConfirm ? 'primary' : ''}}">
        {{confirmLabel}}
      </button>
    </div>
  }
  @if (readonlyDialog) {
    <div mat-dialog-actions class="m-0 p-16 noc-dialog-footer flex flex-row justify-between items-center">
      <span class="grow"></span>
      <button (click)='cancel()' type="button" mat-raised-button color="" class="">Close</button>
    </div>
  }
</div>
