<div class="dialog-content-wrapper noc-dialog" fxLayout="column" fxLayoutAlign="start stretch">
  <div class="m-0 noc-dialog-header" fxLayout="row" fxLayoutAlign="start center">
    <span class="noc-dialog-header-title">Allowed "With" Databases</span>
    <span fxFlex></span>
    <button mat-stroked-button (click)="close()" class="noc-rounded-button noc-sm" aria-label="Close dialog">
      <mat-icon>close</mat-icon> Close
    </button>
  </div>
  <div fxLayout="row" fxLayoutAlign="start start" class="noc-dialog-body">
    <p class="mb-16">The following database prefixes are allowed for the "With" field:</p>
    <div class="allowed-databases-list" fxLayout="column" fxLayoutAlign="start start">
      @for (db of allowedDatabases; track db) {
      <ul class="database-item p-8" fxLayout="row" fxLayoutAlign="start center">
        <li>
          <span class="database-name">{{ db }}</span>
        </li>
      </ul>
      }
    </div>
  </div>
  <div mat-dialog-actions class="m-0 p-16 noc-dialog-footer" fxLayout="row" fxLayoutAlign="end center">
    <button (click)='close()' type="button" mat-raised-button color="primary">Close</button>
  </div>
</div>
