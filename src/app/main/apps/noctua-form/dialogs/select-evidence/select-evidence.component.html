<div class="dialog-content-wrapper">
  <mat-toolbar class="mat-primary m-0">
    <mat-toolbar-row class="grow flex flex-row justify-start items-center">
      <span class="title dialog-title">
        Clone Evidence</span>
      <span class="grow"></span>
      <button mat-stroked-button (click)="close()" class="noc-rounded-button noc-sm" aria-label="Close dialog">
        <fa-icon [icon]="['fas', 'times']"></fa-icon> Close
      </button>
    </mat-toolbar-row>
  </mat-toolbar>
  <div class="noc-dialog-body noc-right-panel noc-form-section">
    <div class="noc-section-header w-full flex flex-row justify-start items-center">
      <div class="noc-section-heading">
        Select Evidence
      </div>
    </div>
    <div class="noc-section-body w-full overflow-y-auto">
      <mat-table class="noc-evidence-table w-full overflow-y-auto" #table [dataSource]="dataSource" matSort
        [@animateStagger]="{value:'50'}">
        <ng-container matColumnDef="select" class="">
          <mat-header-cell *matHeaderCellDef class="w-[30px]">
            <mat-checkbox (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()"
              [indeterminate]="selection.hasValue() && !isAllSelected()">
            </mat-checkbox>
          </mat-header-cell>
          <mat-cell *matCellDef="let row" class="w-[30px]">
            <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
              [checked]="selection.isSelected(row)">
            </mat-checkbox>
          </mat-cell>
        </ng-container>
        <ng-container cdkColumnDef="evidence">
          <mat-header-cell *cdkHeaderCellDef class="w-[40%]">Evidence</mat-header-cell>
          <mat-cell *cdkCellDef="let evidence" class="w-[40%]">
            <p class="">{{evidence.evidence?.label}}</p>
          </mat-cell>
        </ng-container>
        <ng-container cdkColumnDef="reference">
          <mat-header-cell *cdkHeaderCellDef class="w-[20%]">Reference</mat-header-cell>
          <mat-cell *cdkCellDef="let evidence" class="w-[20%]">
            <p class="">{{evidence.reference}}</p>
          </mat-cell>
        </ng-container>
        <ng-container cdkColumnDef="with">
          <mat-header-cell *cdkHeaderCellDef class="w-[20%]">With</mat-header-cell>
          <mat-cell *cdkCellDef="let evidence" class="w-[20%]">
            <p class="">{{evidence.with}}</p>
          </mat-cell>
        </ng-container>
        <ng-container cdkColumnDef="assignedBy">
          <mat-header-cell *cdkHeaderCellDef class="grow">Assigned By</mat-header-cell>
          <mat-cell *cdkCellDef="let evidence" class="grow">
            <p class="">{{evidence.assignedBy}}</p>
          </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)"></mat-row>
      </mat-table>
    </div>
  </div>
  <div class="m-0 p-4 noc-dialog-footer flex flex-row justify-between items-center">
    <span class="grow"></span>
    <button (click)='close()' type="button" mat-raised-button color="" class="mr-2">Cancel</button>
    <button (click)="save()" type="button" mat-raised-button color="primary">Done</button>
  </div>
</div>
