<form [formGroup]="evidenceDBForm" novalidate class="pl-8 pr-8 w-full flex flex-col justify-start items-stretch">
  <div class="w-full flex flex-row justify-start items-center">
    <mat-form-field appearance="outline" class="w-[100px] noc-sm mr-12">
      <mat-select placeholder="" formControlName="db">
        @for (evidenceDB of noctuaFormConfigService.evidenceDBs.options; track evidenceDB) {
        <mat-option [value]="evidenceDB">
          {{evidenceDB.label}}
        </mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="grow noc-sm w-full">
      <input matInput formControlName="accession" type="text" placeholder="Accession" autocomplete="off">
    </mat-form-field>
    <button mat-icon-button (click)="close()">
      <fa-icon [icon]="['far', 'times-circle']"></fa-icon>
    </button>
    <button mat-icon-button (click)="save()">
      <fa-icon [icon]="['far', 'check-circle']"></fa-icon>
    </button>
  </div>
  <div class="w-full flex flex-row justify-start items-center">
    @if (article) {
    <div class="noc-article-info flex flex-col justify-start items-stretch">
      <div class="noc-article-title w-full">
        <a (click)="$event.stopPropagation()" href="{{article.link}}" target="_blank">
          {{article.title}}
        </a>
      </div>
      <div class="noc-article-author w-full">
        <fa-icon [icon]="['fas', 'user']" class="s-16 mr-4"></fa-icon> <span>{{article.author}}</span>
      </div>
      <div class="noc-article-date w-full">
        <fa-icon [icon]="['fas', 'calendar-alt']" class="s-16 mr-4"></fa-icon> <span>{{article.date}}</span>
      </div>
    </div>
    }
  </div>
</form>
