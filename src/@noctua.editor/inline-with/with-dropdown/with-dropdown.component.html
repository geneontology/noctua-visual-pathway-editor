<form [formGroup]="myForm" novalidate class="pl-8 pr-8 w-full flex flex-col justify-start items-stretch">
  <div formArrayName="databaseGroups" class="noc-form-section w-full overflow-y-auto flex flex-col justify-start items-stretch">

    @for (group of myForm.get('databaseGroups')?.controls; track group; let i = $index) {
    <div class="noc-with-group mb-16 px-12">
      <div [formGroupName]="i">
        <div class="mb-8 flex flex-row justify-start items-center">
          <strong class="mr-8">With/From</strong>
          <button mat-icon-button (click)="deleteGroup(i)" matTooltip="Delete Group">
            <fa-icon [icon]="['far', 'trash-alt']"></fa-icon>
          </button>
        </div>
        <div formArrayName="entities">
          @for (entity of group.get('entities').controls; track entity; let j = $index) {
          <div class="mb-8 flex flex-row justify-start items-center">
            <div [formGroupName]="j" class="flex flex-row justify-start items-center grow">
              <mat-form-field appearance="outline" class="w-[120px] noc-sm mr-12">
                <mat-select formControlName="db" placeholder="Database">
                  @for (db of dbOptions; track db) {
                  <mat-option [value]="db">
                    {{db}}
                  </mat-option>
                  }
                </mat-select>
              </mat-form-field>
              <mat-form-field appearance="outline" class="grow noc-sm">
                <input matInput formControlName="accession" type="text" placeholder="Accession" autocomplete="off">
              </mat-form-field>
            </div>
            <button mat-icon-button (click)="addNewEntity(group.get('entities'), null, null)" matTooltip="Add Entity">
              <fa-icon [icon]="['fas', 'plus']"></fa-icon>
            </button>
            <button mat-icon-button (click)="deleteEntity(group.get('entities'), j)" matTooltip="Delete Entity">
              <fa-icon [icon]="['far', 'trash-alt']"></fa-icon>
            </button>
          </div>
          }
          @if (group.get('entities').controls.length === 0) {
          <div class="p-16">
            <a (click)="addNewEntity(group.get('entities'), null, null)">
              Add With/From
            </a>
          </div>
          }
        </div>
      </div>
    </div>
    }
    <button mat-button (click)="addNewGroup()">Add Group</button>

    <!--   <pre>{{myForm.value | json}}</pre> -->
  </div>
  <div class="w-full flex flex-row justify-end items-center">
    <button mat-button (click)="close()">
      Cancel
    </button>
    <button mat-button color="primary" (click)="save()">
      Ok
    </button>
  </div>
</form>
